
name: Go Docker CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start LocalStack
        run: docker compose up -d localstack

      - name: Run Docker Compose tests
        run: docker compose run --rm tests

      - name: Stop Docker Compose services
        if: always()
        run: docker compose down

      - name: Send Slack notification
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          JOB_STATUS: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            python3 - <<'PY' > /tmp/slack-payload.json
          import json
          import os

          status = os.environ["JOB_STATUS"]
          message = {
              "text": (
                  f"GitHub Actions - Go Docker CI\n"
                  f"Repository: {os.environ['REPOSITORY']}\n"
                  f"Status: {status}\n"
                  f"Summary: Docker build and Go unit tests completed with status: {status}\n"
                  f"Run: {os.environ['RUN_URL']}"
              )
          }
          print(json.dumps(message))
          PY
            curl --fail --silent --show-error \
              -X POST \
              -H 'Content-type: application/json' \
              --data-binary @/tmp/slack-payload.json \
              "$SLACK_WEBHOOK_URL"
          else
            echo "SLACK_WEBHOOK_URL is not configured."
          fi
